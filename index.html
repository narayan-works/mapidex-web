<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mapidex web shell</title>
<style>
  :root {
    --bg: #e8e6df;
    --ink: #111;
    --muted: #5a5a5a;
    --device: #222;
    --screen-bg: #c5c8b4;
    --px: #12120e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
    gap: 16px;
  }
  header { width: min(520px, 100%); }
  header h1 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
  header p { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
  .device {
    background: var(--device);
    border-radius: 22px;
    padding: 14px 14px 20px;
    box-shadow: 0 16px 36px rgba(0,0,0,.2);
    position: relative;
  }
  .bezel { background: #0a0a0a; border-radius: 6px; padding: 6px; }
  /* Hard Playdate stage: layout math is always 400x240. Scale visually with zoom. */
  .stage-wrap {
    width: 400px;
    height: 240px;
    transform-origin: top left;
  }
  #stage {
    width: 400px;
    height: 240px;
    background: var(--screen-bg);
    color: var(--px);
    position: relative;
    overflow: hidden;
    image-rendering: pixelated;
    font-family: ui-monospace, Menlo, monospace;
    outline: none;
  }
  @media (min-width: 860px) {
    .stage-wrap { transform: scale(2); margin-bottom: 240px; }
  }
  .hw {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding: 0 4px;
  }
  .crank-btn {
    width: 42px; height: 42px; border-radius: 50%;
    border: 2px solid #666; background: #333; color: #bbb;
    cursor: pointer; font-size: 14px;
  }
  .ab { display: flex; gap: 10px; }
  .ab button {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid #777; background: #2c2c2c; color: #ddd;
    cursor: pointer; font-size: 12px; font-weight: 700;
  }
  .ab button:active, .crank-btn:active { background: #555; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px;
    width: min(520px, 100%); justify-content: center;
  }
  .toolbar button, .jumps button {
    font: inherit; font-size: 12px;
    border: 1.5px solid #222; background: #fff; padding: 7px 10px;
    border-radius: 8px; cursor: pointer;
  }
  .toolbar button.primary { background: #111; color: #eee; }
  .jumps { display: flex; flex-wrap: wrap; gap: 6px; width: min(520px, 100%); justify-content: center; }
  .note { font-size: 11px; color: var(--muted); width: min(520px, 100%); text-align: center; min-height: 2.5em; }

  /* ---- screen chrome ---- */
  .pad { padding: 8px; height: 100%; display: flex; flex-direction: column; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .tiny { font-size: 10px; line-height: 1.2; letter-spacing: 0.02em; }
  .hero { font-size: 14px; font-weight: 700; line-height: 1.2; margin-top: 6px; }
  /* ~36 chars at 11px across ~384px usable */
  .body11 { font-size: 11px; line-height: 1.25; }
  .title20 { font-size: 20px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; }
  .muted { opacity: 0.7; }
  .badge {
    border: 1.5px solid var(--px);
    padding: 1px 5px;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .list { list-style: none; margin-top: 10px; }
  .list li {
    font-size: 11px; padding: 5px 6px;
    border: 1.5px solid transparent;
    display: flex; justify-content: space-between;
  }
  .list li.on { border-color: var(--px); background: var(--px); color: var(--screen-bg); }
  .dots { display: flex; gap: 3px; margin-top: 6px; }
  .dots i {
    width: 4px; height: 4px; border-radius: 50%;
    border: 1.5px solid var(--px); display: block;
  }
  .dots i.on { background: var(--px); }
  .grow { flex: 1; }
  .path-band {
    display: grid;
    grid-template-columns: 1fr 150px;
    gap: 8px;
    flex: 1;
    min-height: 0;
  }
  .path-copy { display: flex; flex-direction: column; min-width: 0; }
  .path-art {
    border: 1.5px solid var(--px);
    background:
      repeating-linear-gradient(0deg, transparent 0 7px, rgba(18,18,14,.25) 7px 8px),
      repeating-linear-gradient(90deg, transparent 0 7px, rgba(18,18,14,.15) 7px 8px);
    position: relative;
  }
  .path-art::after {
    content: "";
    position: absolute; left: 10%; right: 10%; top: 45%;
    height: 2px; background: var(--px);
  }
  .path-art .dot {
    position: absolute; width: 6px; height: 6px;
    background: var(--px); border-radius: 50%;
    left: 18%; top: calc(45% - 2px);
  }
  .actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px;
  }
  .actions span {
    border: 1.5px solid var(--px);
    text-align: center; font-size: 10px; padding: 5px 4px;
  }
  .actions span.heavy { background: var(--px); color: var(--screen-bg); }
  .card-img {
    height: 112px; border: 1.5px solid var(--px);
    display: grid; place-items: center;
    font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    background:
      repeating-linear-gradient(45deg, var(--px) 0 1px, transparent 1px 5px),
      #a8ab98;
  }
  .center { flex: 1; display: grid; place-items: center; text-align: center; }
  .saved li { font-size: 11px; padding: 5px 0; border-bottom: 1px solid rgba(0,0,0,.25); list-style: none; }
  .saved li:last-child { border: 0; }
  .empty { font-size: 11px; opacity: .6; text-align: center; margin-top: 28px; }
</style>
</head>
<body>
  <header>
    <h1>Mapidex web shell</h1>
    <p>Hard 400x240 Playdate frame (2x on wide screens). A/B only + discrete crank. ASCII copy. Overflow judgments happen inside the box.</p>
  </header>

  <div class="device">
    <div class="bezel">
      <div class="stage-wrap">
        <div id="stage" tabindex="0" aria-label="Playdate screen"></div>
      </div>
    </div>
    <div class="hw">
      <button type="button" class="crank-btn" id="crank" title="Crank tick">CR</button>
      <div class="ab">
        <button type="button" id="btnB">B</button>
        <button type="button" id="btnA">A</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button type="button" id="tickPrev">crank -</button>
    <button type="button" id="tickNext">crank +</button>
    <button type="button" class="primary" id="doA">A primary</button>
    <button type="button" id="doB">B secondary</button>
  </div>
  <div class="jumps">
    <button type="button" data-go="splash">splash</button>
    <button type="button" data-go="start">start</button>
    <button type="button" data-go="loading">loading</button>
    <button type="button" data-go="path">path</button>
    <button type="button" data-go="ask">ask</button>
    <button type="button" data-go="saved">saved</button>
  </div>
  <p class="note" id="note"></p>

<script>
const CATEGORIES = ["relax", "play", "social", "essentials"];

function ascii(s) {
  return String(s || "")
    .replace(/[·•]/g, "-")
    .replace(/[—–]/g, "-")
    .replace(/→/g, "->")
    .replace(/…/g, "...")
    .replace(/[^\x20-\x7E]/g, "");
}

let FEED = {
  gist: "foot - 0.9 mi - 4 min",
  summary: "Founders Inc -> Greenwich",
  turns: [
    "Head out  118 ft",
    "Turn right  197 ft",
    "Turn left onto Market  0.2 mi",
    "Turn right onto Polk  0.3 mi",
    "Continue on Van Ness  0.4 mi",
    "Turn left onto Greenwich  284 ft",
    "Arrive  2143 Greenwich"
  ],
  places: ["Mel's Drive-In", "Naked Fish", "Mamacita"],
  placesByCat: null
};

const ASK = {
  title: "Golden Gate Bridge",
  layers: [
    "1937 suspension bridge SF-Marin",
    "Joseph Strauss / Art Deco towers",
    "1.7 mi / International Orange"
  ]
};

const state = {
  screen: "splash",
  cat: 2,
  stop: 0,
  layer: 0,
  saved: JSON.parse(localStorage.getItem("mapidex_saved_v2") || "[]")
};

function placesForCat() {
  const key = CATEGORIES[state.cat];
  if (FEED.placesByCat && FEED.placesByCat[key]) return FEED.placesByCat[key];
  return FEED.places;
}

function stops() {
  return [
    ...FEED.turns.map(t => ({ kind: "turn", text: t })),
    ...placesForCat().map(p => ({ kind: "place", text: p }))
  ];
}

function note(msg) { document.getElementById("note").textContent = msg; }

function dots(n, i) {
  return `<div class="dots">${Array.from({length:n},(_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>`;
}

function go(s) {
  state.screen = s;
  if (s === "path") state.stop = 0;
  if (s === "ask") state.layer = 0;
  if (s === "loading") {
    render();
    setTimeout(() => go("path"), 1200);
    return;
  }
  render();
}

function tick(d) {
  if (state.screen === "start") {
    state.cat = (state.cat + d + CATEGORIES.length) % CATEGORIES.length;
  } else if (state.screen === "path") {
    const n = stops().length;
    state.stop = Math.max(0, Math.min(n - 1, state.stop + d));
  } else if (state.screen === "ask") {
    state.layer = Math.max(0, Math.min(ASK.layers.length - 1, state.layer + d));
  }
  render();
}

function pressA() {
  if (state.screen === "splash") return go("start");
  if (state.screen === "start") return go("loading");
  if (state.screen === "path") return go("ask");
  if (state.screen === "ask") return go("path");
  if (state.screen === "saved") return go("path");
}

function pressB() {
  if (state.screen === "start") return go("saved");
  if (state.screen === "path") return capture();
  if (state.screen === "ask") return go("path");
  if (state.screen === "saved") return go("start");
}

function capture() {
  const entry = {
    id: "gg-bridge",
    title: ASK.title,
    category: CATEGORIES[state.cat],
    at: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
  };
  state.saved = [entry, ...state.saved.filter(x => x.id !== entry.id)];
  localStorage.setItem("mapidex_saved_v2", JSON.stringify(state.saved));
  go("saved");
}

function render() {
  const el = document.getElementById("stage");
  let html = "";

  if (state.screen === "splash") {
    html = `<div class="pad">
      <div class="grow center"><div>
        <div class="title20">MaPeDex</div>
        <p class="tiny muted" style="margin-top:8px">commute detours / catch what you pass</p>
      </div></div>
      <div class="row tiny"><span></span><span>A start</span></div>
    </div>`;
    note("Splash. A = start. Hard 400x240 stage.");
  }

  if (state.screen === "start") {
    html = `<div class="pad">
      <div class="row"><span class="tiny muted">pick a detour</span><span class="badge">at work</span></div>
      <ul class="list">
        ${CATEGORIES.map((c,i)=>`<li class="${i===state.cat?"on":""}"><span>${c}</span><span>${i===state.cat?"<":""}</span></li>`).join("")}
      </ul>
      <div class="grow"></div>
      <div class="row tiny"><span>crank / d-pad</span><span>A go  B saved</span></div>
    </div>`;
    note("Start: quiet at-work badge. Crank picks category. A commits once.");
  }

  if (state.screen === "loading") {
    html = `<div class="pad"><div class="center"><div>
      <div class="hero">Building path...</div>
      <p class="tiny muted" style="margin-top:8px">${FEED.summary}</p>
      <p class="tiny muted">${CATEGORIES[state.cat]}</p>
    </div></div></div>`;
    note("Loading. Real copy from last_feed.json when available.");
  }

  if (state.screen === "path") {
    const all = stops();
    const s = all[state.stop];
    const kind = s.kind === "turn" ? "turn" : "place";
    const gistLine = `${CATEGORIES[state.cat]}  ${FEED.gist}`;
    html = `<div class="pad">
      <div class="path-band">
        <div class="path-copy">
          <div class="row tiny"><span>${gistLine}</span></div>
          <div class="hero">${s.text}</div>
          <p class="tiny muted" style="margin-top:4px">${kind}</p>
          ${dots(all.length, state.stop)}
        </div>
        <div class="path-art" aria-hidden="true"><span class="dot"></span></div>
      </div>
      <div class="actions">
        <span>A Ask</span>
        <span class="heavy">B Capture</span>
      </div>
    </div>`;
    note(`Path 3-line band. Stop ${state.stop+1}/${all.length} (${kind}). A=Ask B=Capture. Gist chars: ${gistLine.length}`);
  }

  if (state.screen === "ask") {
    html = `<div class="pad" style="padding-top:6px">
      <div class="card-img">entry.pdi</div>
      <div class="hero" style="font-size:13px;margin-top:6px">${ASK.title}</div>
      <p class="body11" style="margin-top:4px">${ASK.layers[state.layer]}</p>
      ${dots(ASK.layers.length, state.layer)}
      <div class="grow"></div>
      <div class="row tiny"><span>crank facts</span><span>B back</span></div>
    </div>`;
    note(`Ask card / Pokedex mode. Layer ${state.layer+1}/${ASK.layers.length}.`);
  }

  if (state.screen === "saved") {
    html = `<div class="pad">
      <div class="hero" style="font-size:13px">Saved</div>
      <p class="tiny muted">caught on this walk</p>
      ${state.saved.length === 0
        ? `<p class="empty">nothing caught yet</p>`
        : `<ul class="saved" style="margin-top:8px">${state.saved.map(s=>
            `<li><strong>${s.title}</strong><br/><span class="tiny muted">${s.category} / ${s.at}</span></li>`).join("")}</ul>`}
      <div class="grow"></div>
      <div class="row tiny"><span></span><span>A/B back</span></div>
    </div>`;
    note(`Saved = name + category. ${state.saved.length} item(s).`);
  }

  el.innerHTML = html;
  document.getElementById("crank").style.transform =
    `rotate(${(state.stop + state.layer + state.cat) * 28}deg)`;
}

document.getElementById("btnA").onclick = pressA;
document.getElementById("btnB").onclick = pressB;
document.getElementById("doA").onclick = pressA;
document.getElementById("doB").onclick = pressB;
document.getElementById("crank").onclick = () => tick(1);
document.getElementById("tickPrev").onclick = () => tick(-1);
document.getElementById("tickNext").onclick = () => tick(1);
document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));

const stage = document.getElementById("stage");
stage.addEventListener("wheel", e => { e.preventDefault(); tick(e.deltaY > 0 ? 1 : -1); }, { passive: false });
window.addEventListener("keydown", e => {
  if (["ArrowDown","ArrowRight"].includes(e.key)) { e.preventDefault(); tick(1); }
  if (["ArrowUp","ArrowLeft"].includes(e.key)) { e.preventDefault(); tick(-1); }
  if (e.key === "Enter" || e.key === "a" || e.key === "A" || e.key === "s" || e.key === "S") { e.preventDefault(); pressA(); }
  if (e.key === "Escape" || e.key === "b" || e.key === "B") { e.preventDefault(); pressB(); }
});

async function boot() {
  try {
    const res = await fetch("last_feed.json", { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      const r = data.route || {};
      FEED.gist = ascii(r.summary || FEED.gist);
      FEED.summary = ascii(`${r.from || ""} -> ${r.to || ""}`.trim() || FEED.summary);
      FEED.turns = (r.instructions || []).map(ascii);
      FEED.placesByCat = {};
      const cats = data.categories || {};
      for (const k of CATEGORIES) {
        FEED.placesByCat[k] = (cats[k] || []).map(p => ascii(p.name));
      }
      FEED.places = (data.selected_places || []).map(p => ascii(p.name));
      if (data.selected && CATEGORIES.includes(data.selected)) {
        state.cat = CATEGORIES.indexOf(data.selected);
      }
    }
  } catch (e) { /* keep fallback */ }
  go("splash");
  stage.focus();
}

boot();
</script>
</body>
</html>
